<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dev Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">Dev<span class="accent">Portfolio</span></div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#projects">Projects</a></li>
            <li><a href="#add-work" class="btn-nav">Add Work</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <header id="home">
        <div class="hero-content">
            <h1>Hi, I'm <span class="accent">Dev</span></h1>
            <p>A passionate Developer building cool things with code.</p>
            <div class="social-icons">
                <a href="#"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-linkedin"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
        </div>
    </header>

    <!-- Admin Section: Add New Project -->
    <!-- In a real app, this would be behind a login -->
    <section id="add-work">
        <div class="container">
            <h2>Upload New Project</h2>
            <form id="project-form">
                <input type="text" id="p-title" placeholder="Project Title" required>
                <input type="text" id="p-tags" placeholder="Tags (e.g., HTML, CSS, Python)" required>
                <input type="text" id="p-img" placeholder="Image URL (optional)" >
                <textarea id="p-desc" placeholder="Project Description" required></textarea>
                <input type="text" id="p-link" placeholder="Project Link (GitHub/Live Demo)" required>
                <button type="submit" class="btn-submit">Add to Portfolio</button>
            </form>
        </div>
    </section>

    <!-- Projects Display Section -->
    <section id="projects">
        <div class="container">
            <h2>My Work</h2>
            <div class="projects-grid" id="projects-container">
                <!-- Projects will be injected here by JavaScript -->
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2023 My Dev Portfolio. Built with code.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
